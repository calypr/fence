<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | CALYPR</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fa; color: #263447; font-family: Arial, sans-serif; }
      main { box-sizing: border-box; width: min(100% - 2rem, 34rem); padding: 2.5rem; background: #fff; border-radius: 1rem; box-shadow: 0 12px 36px #172b4d1a; }
      h1 { margin: 0 0 1rem; font-size: 1.8rem; line-height: 1.2; }
      p { line-height: 1.6; }
      a { color: #0759b5; }
      .button { display: inline-block; margin-top: 1rem; padding: .75rem 1.25rem; border-radius: .4rem; background: #0759b5; color: #fff; font-weight: bold; text-decoration: none; }
      .button:focus-visible { outline: 3px solid #263447; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>{{ title }}</h1>
      <p>{{ message }}</p>
      {% if support_email %}
      <p>For help, contact <a href="mailto:{{ support_email }}">{{ support_email }}</a>.</p>
      {% endif %}
      <a class="button" href="{{ home_url }}">Return to CALYPR</a>
    </main>
  </body>
</html>
