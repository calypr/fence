name: Markdown validation

on:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    paths:
    - .github/workflows/validate_markdown.yaml
    - "**.md"

jobs:
  markdown-validation:
    name: Markdown validation
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Lint markdown
      uses: DavidAnson/markdownlint-cli2-action@v18
      with:
        globs: |
          **/*.md
