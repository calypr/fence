name: Build and publish fence image

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Login to Quay.io
      uses: docker/login-action@v3
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_ROBOT_TOKEN }}

    - name: Build and push image
      env:
        REPO: quay.io/ohsu-comp-bio/fence
      run: |
        BRANCH=$(echo ${GITHUB_REF#refs/*/} | tr / _)
        echo "Setting image tag to $REPO:$BRANCH"

        docker build \
          --build-arg GITCOMMIT="${GITHUB_SHA}" \
          --build-arg GITVERSION="${BRANCH}" \
          -t "$REPO:$BRANCH" .

        if [[ $BRANCH == 'main' ]]; then
          docker image tag "$REPO:main" "$REPO:latest"
        fi

        docker push --all-tags "$REPO"
