name: CI

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  unit-test:
    name: Python unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Poetry
      run: pip install "poetry==2.2.1"

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Generate test keys
      run: |
        mkdir -p tests/resources/keys
        cd tests/resources/keys
        openssl genrsa -out test_private_key.pem 2048
        openssl rsa -in test_private_key.pem -pubout -out test_public_key.pem
        openssl genrsa -out test_private_key_2.pem 2048
        openssl rsa -in test_private_key_2.pem -pubout -out test_public_key_2.pem

    - name: Run test suite
      env:
        PGHOST: localhost
        PGPORT: 5432
      run: tests/ci_commands_script.sh
